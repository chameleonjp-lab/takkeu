name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_call:
    inputs:
      expected_sha:
        description: 'Exact commit to validate for a Pages release'
        required: false
        type: string
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          # Verification inputs are code/tests/assets, not multi-GB historical evidence.
          # Top-level configuration and every source, test, script and migration remain.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the primary Ubuntu HTTPS mirror for browser dependencies
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Dependencies
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm ci 2>&1 | tee artifacts/install.log
          npx playwright install --with-deps chromium webkit 2>&1 | tee artifacts/browsers.log
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee artifacts/typecheck.log
      - name: Unit tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee artifacts/unit.log
      - name: Release guard tests (no production connection)
        run: npm run test:release-guards
      - name: Production DB release gates on disposable PostgreSQL
        run: node tests/helpers/checkReleaseDatabase.mjs
      - name: Approved-only migration and scoped RPC proposals on PostgreSQL17
        run: node tests/helpers/checkProductionReadiness.mjs
      - name: Fixed GET inspector on PostgreSQL17 and real PostgREST (disposable only)
        run: node tests/helpers/checkRestInspector.mjs
      - name: Hall registration concurrency on disposable PostgreSQL
        run: |
          set -o pipefail
          mkdir -p artifacts/goal-3500
          node tests/helpers/checkHallConcurrency.mjs 2>&1 | tee artifacts/goal-3500/postgres-concurrency.log
      - name: Build and test root and Pages distributions
        run: |
          set -o pipefail
          npm run verify:release 2>&1 | tee artifacts/build-release.log
      - name: Bind every Pages file to this CI checkout
        run: node scripts/release/distribution.mjs write dist artifacts/pages-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-pages-contract-${{ github.sha }}
          path: artifacts/pages-manifest.json
          retention-days: 30
      - name: Record revision
        if: always()
        run: |
          git rev-parse HEAD > artifacts/commit.txt
          node --version > artifacts/node.txt
          npm --version > artifacts/npm.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          retention-days: 30
          path: |
            artifacts/
            test-results/
            playwright-report/

  browser:
    name: Browser (${{ matrix.project }}, ${{ matrix.suite }})
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
        suite: [interaction, load]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          # Verification inputs are code/tests/assets, not multi-GB historical evidence.
          # Top-level configuration and every source, test, script and migration remain.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the primary Ubuntu HTTPS mirror for browser dependencies
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Dependencies
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm ci 2>&1 | tee artifacts/install.log
          npx playwright install --with-deps ${{ matrix.project }} 2>&1 | tee artifacts/browsers.log
      - name: Browser tests
        run: |
          set -o pipefail
          takkeu_load_pattern='開始から実際|450の30球|555の30球'
          if [ '${{ matrix.suite }}' = 'load' ]; then
            npm run test:browser -- --project=${{ matrix.project }} --grep "$takkeu_load_pattern" 2>&1 | tee artifacts/browser.log
          else
            npm run test:browser -- --project=${{ matrix.project }} --grep-invert "$takkeu_load_pattern" 2>&1 | tee artifacts/browser.log
          fi
      - name: Record revision
        if: always()
        run: |
          git rev-parse HEAD > artifacts/commit.txt
          node --version > artifacts/node.txt
          npm --version > artifacts/npm.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-browser-${{ matrix.project }}-${{ matrix.suite }}-${{ github.sha }}
          retention-days: 30
          path: |
            artifacts/
            test-results/
            playwright-report/

  # Keep the original required-check name tied to every browser group.
  verify:
    needs: [core, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs
        run: |
          test '${{ needs.core.result }}' = 'success'
          test '${{ needs.browser.result }}' = 'success'
